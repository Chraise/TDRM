{% extends "base.html" %}

{% block title %}注册 - 宿舍报修与设备维护管理系统{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-5">
        <div class="text-center mb-4">
            <h2 class="card-title mb-2">用户注册</h2>
            <p class="text-muted">创建新账号</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="username" 
                    name="username" 
                    placeholder="请输入用户名（2-50个字符）" 
                    required 
                    autofocus
                    minlength="2"
                    maxlength="50"
                    value="{{ request.form.username if request.form else '' }}"
                >
                <small class="form-text text-muted">用户名将用于登录，请妥善保管</small>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                <input 
                    type="password" 
                    class="form-control" 
                    id="password" 
                    name="password" 
                    placeholder="请输入密码（至少6个字符）" 
                    required
                    minlength="6"
                >
            </div>
            
            <div class="mb-3">
                <label for="password_confirm" class="form-label">确认密码 <span class="text-danger">*</span></label>
                <input 
                    type="password" 
                    class="form-control" 
                    id="password_confirm" 
                    name="password_confirm" 
                    placeholder="请再次输入密码" 
                    required
                    minlength="6"
                >
            </div>
            
            <div class="mb-3">
                <label for="role" class="form-label">角色 <span class="text-danger">*</span></label>
                <select class="form-select" id="role" name="role" required>
                    <option value="">请选择角色</option>
                    <option value="Student" {{ 'selected' if request.form and request.form.role == 'Student' else '' }}>学生</option>
                    <option value="Worker" {{ 'selected' if request.form and request.form.role == 'Worker' else '' }}>维修人员</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="contact" class="form-label">联系电话</label>
                <input 
                    type="tel" 
                    class="form-control" 
                    id="contact" 
                    name="contact" 
                    placeholder="请输入联系电话（可选）" 
                    maxlength="20"
                    value="{{ request.form.contact if request.form else '' }}"
                >
            </div>
            
            <div class="mb-3">
                <label for="building_name" class="form-label">宿舍楼</label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="building_name" 
                    name="building_name" 
                    list="buildings_list"
                    placeholder="请输入或选择宿舍楼名称（可选）" 
                    value="{{ request.form.building_name if request.form else '' }}"
                >
                <datalist id="buildings_list">
                    {% for building in buildings %}
                    <option value="{{ building.building_name }}">
                    {% endfor %}
                </datalist>
            </div>
            
            <div class="mb-3" id="room_no_group">
                <label for="room_no" class="form-label">房间号</label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="room_no" 
                    name="room_no" 
                    placeholder="请输入房间号（学生必填）" 
                    maxlength="10"
                    value="{{ request.form.room_no if request.form else '' }}"
                >
            </div>
            
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg">注册</button>
            </div>
            
            <div class="text-center">
                <small class="text-muted">
                    已有账号？<a href="{{ url_for('auth.login') }}">立即登录</a>
                </small>
            </div>
        </form>
    </div>
</div>

<script>
// 根据角色选择动态显示/隐藏房间号字段
document.getElementById('role').addEventListener('change', function() {
    const roomNoGroup = document.getElementById('room_no_group');
    const roomNoInput = document.getElementById('room_no');
    
    if (this.value === 'Student') {
        roomNoGroup.style.display = 'block';
        roomNoInput.setAttribute('required', 'required');
    } else {
        roomNoGroup.style.display = 'block'; // 仍然显示，但非必填
        roomNoInput.removeAttribute('required');
    }
});

// 页面加载时检查角色选择
document.addEventListener('DOMContentLoaded', function() {
    const roleSelect = document.getElementById('role');
    if (roleSelect.value === 'Student') {
        document.getElementById('room_no').setAttribute('required', 'required');
    }
});
</script>
{% endblock %}
