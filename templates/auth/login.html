{% extends "base.html" %}

{% block title %}登录 - 宿舍报修与设备维护管理系统{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-5">
        <div class="text-center mb-4">
            <h2 class="card-title mb-2">宿舍报修与设备维护管理系统</h2>
            <p class="text-muted">TDRM - Dormitory Repair & Maintenance System</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="username" 
                    name="username" 
                    placeholder="请输入用户名" 
                    required 
                    autofocus
                    value="{{ request.form.username if request.form else '' }}"
                >
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input 
                    type="password" 
                    class="form-control" 
                    id="password" 
                    name="password" 
                    placeholder="请输入密码" 
                    required
                >
            </div>
            
            <div class="mb-3 form-check">
                <input 
                    type="checkbox" 
                    class="form-check-input" 
                    id="remember" 
                    name="remember"
                >
                <label class="form-check-label" for="remember">
                    记住我
                </label>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">登录</button>
            </div>
        </form>
        
        <div class="mt-3 text-center">
            <small class="text-muted">
                还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a>
            </small>
        </div>
        
        <div class="mt-4 text-center">
            <small class="text-muted">
                系统版本 1.0.0
            </small>
        </div>
    </div>
</div>
{% endblock %}
