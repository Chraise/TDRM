{% extends "base.html" %}

{% block title %}学生首页{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-5">
        <h2 class="card-title mb-4">学生首页</h2>
        <p class="text-muted">欢迎，{{ current_user.username }}！</p>
        <p>您的角色：学生</p>
        {% if current_user.room_no %}
        <p>房间号：{{ current_user.room_no }}</p>
        {% endif %}
        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger">登出</a>
    </div>
</div>
{% endblock %}
